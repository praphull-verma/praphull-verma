
name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: praphull-verma
          outputs: |
            dist/snake.svg?color_snake=%23B4A0E5&color_dots=%23ebedf0,%23ded4f5,%23b4a0e5,%238e73cb,%235e4694
            dist/snake-dark.svg?palette=github-dark&color_snake=%23B4A0E5&color_dots=%23161B22,%23302447,%23513D78,%238E73CB,%23B4A0E5

      - name: Publish animation
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
